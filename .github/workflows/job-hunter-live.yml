name: Job Hunter live recovery

# SEARCH-QUOTA CONTRACT (Product Owner decision, 2026-09-17): TWO live runs
# per week.
#
# Each live run issues ~17 SerpApi queries, and the SerpApi key is a 250/month
# allowance SHARED with the IT-Lens project. The previous triggers ran a full
# live pipeline on every push to main AND on pull requests touching
# apps/job-hunter-mvp/** or profile/** — so ordinary code changes silently
# spent the allowance (the 2026-09-17 history shows 8 result-refresh commits in
# the last 15). At 2 runs/week this is ~34 queries/week ≈ 148/month, leaving
# headroom for IT-Lens.
#
# Deterministic tests still run on every push/PR — see job-hunter-tests.yml,
# which needs no API key. Do NOT add a push or pull_request trigger here.
on:
  workflow_dispatch:
  schedule:
    # Monday and Thursday, 05:30 UTC (07:30 CEST / 06:30 CET) so a fresh list
    # is waiting at the start of the day.
    - cron: '30 5 * * 1,4'

permissions:
  contents: write

jobs:
  live-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run deterministic regression suite
        run: node --test apps/job-hunter-mvp/lib/*.test.mjs apps/job-hunter-mvp/presentation/*.test.mjs

      # Refuse to start a run that cannot finish inside the remaining allowance.
      # A partial run is the worst outcome: it spends what is left AND returns an
      # incomplete result set in which unsearched role families look like
      # "no such jobs exist".
      - name: Pre-flight search quota check
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: node scripts/check-search-quota.mjs --need 17

      - name: Execute live Job Hunter pipeline
        id: live
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: node apps/job-hunter-mvp/run.mjs

      - name: Enforce live product acceptance
        id: acceptance
        continue-on-error: true
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'docs/evidence/real-job-hunter-current-run.json';
          if (!fs.existsSync(path)) {
            console.error(`ACCEPTANCE FAIL: missing ${path}`);
            process.exit(1);
          }
          const run = JSON.parse(fs.readFileSync(path, 'utf8'));
          const visibleFromResults = Array.isArray(run.results)
            ? run.results.filter(result => result?.visible === true && result.poDecision !== 'DO_NOT_APPLY').length
            : 0;
          const visible = visibleFromResults;
          const canaries = Array.isArray(run.canaries) ? run.canaries : [];
          const resolvedCanaryStatuses = new Set([
            'ACQUIRED_VISIBLE',
            'ACQUIRED_EXCLUDED',
            'ACQUIRED_SCORED_BELOW_THRESHOLD',
          ]);
          const unresolvedCanaries = canaries.filter(c => !resolvedCanaryStatuses.has(c.status));
          const summary = {
            generatedAt: run.generatedAt,
            visible,
            canariesReachedScoring: run.canariesReachedScoring,
            canaries: canaries.map(c => ({ id: c.id, status: c.status, score: c.score ?? null })),
            funnelSummary: run.funnelSummary ?? null,
          };
          console.log(JSON.stringify(summary, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Job Hunter live acceptance\n\n\`\`\`json\n${JSON.stringify(summary, null, 2)}\n\`\`\`\n`);

          const failures = [];
          if (visible < 7) failures.push(`only ${visible} visible results; active product requirement asks for 7-15 when current inventory supports it`);
          if (run.canariesReachedScoring !== true) failures.push('known-positive canaries did not all reach scoring');
          if (unresolvedCanaries.length) failures.push(`unresolved canaries: ${unresolvedCanaries.map(c => `${c.id}=${c.status}`).join(', ')}`);
          if (failures.length) {
            console.error(`ACCEPTANCE FAIL:\n- ${failures.join('\n- ')}`);
            process.exit(1);
          }
          console.log('ACCEPTANCE PASS');
          NODE

      - name: Publish human-readable current results
        if: steps.live.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          # run.mjs generates this through the same CV-aware renderer used by cron.
          # Never republish an old snapshot when the live pipeline failed.
          git config user.name 'job-hunter-bot'
          git config user.email 'job-hunter-bot@users.noreply.github.com'
          git add CURRENT_RESULTS.md
          if git diff --cached --quiet; then
            echo 'CURRENT_RESULTS.md unchanged.'
          else
            git commit -m 'results: refresh current Job Hunter vacancies'
            git push
          fi

      - name: Publish run evidence
        if: always() && steps.live.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: job-hunter-live-evidence
          path: |
            CURRENT_RESULTS.md
            docs/evidence/current-cv-results.html
            docs/evidence/real-job-hunter-current-run.json
            docs/evidence/job-hunter-runs/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow when product acceptance failed
        if: always() && steps.acceptance.outcome == 'failure'
        run: exit 1
