name: Job Hunter live recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/job-hunter-live.yml'
      - 'apps/job-hunter-mvp/**'
      - 'profile/**'

permissions:
  contents: read

jobs:
  live-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run deterministic regression suite
        run: node --test apps/job-hunter-mvp/lib/*.test.mjs

      - name: Materialize runtime-only acquisition credential
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          sudo install -d -m 700 -o "$(id -un)" -g "$(id -gn)" /home/dockeruser/.job-hunter-secrets
          umask 077
          if [ -n "$SERPAPI_API_KEY" ]; then
            printf 'SERPAPI_API_KEY=%s\n' "$SERPAPI_API_KEY" > /home/dockeruser/.job-hunter-secrets/serpapi.env
            echo 'SerpApi credential available; running full multi-source acquisition.'
          else
            # run.mjs already treats individual SerpApi search failures as non-fatal
            # and then executes the independent direct Profession.hu acquisition path.
            # A deliberately invalid sentinel lets the live pipeline continue to that
            # source instead of turning a missing optional discovery credential into
            # a total project stall.
            printf 'SERPAPI_API_KEY=GITHUB_DIRECT_PROFESSION_FALLBACK\n' > /home/dockeruser/.job-hunter-secrets/serpapi.env
            echo 'SERPAPI_API_KEY absent; exercising direct Profession.hu fallback.'
          fi

      - name: Execute live Job Hunter pipeline
        run: node apps/job-hunter-mvp/run.mjs

      - name: Publish run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-hunter-live-evidence
          path: |
            docs/evidence/real-job-hunter-current-run.json
            docs/evidence/job-hunter-runs/*.json
          if-no-files-found: warn
          retention-days: 14
