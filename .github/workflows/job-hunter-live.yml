name: Job Hunter live recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/job-hunter-live.yml'
      - 'apps/job-hunter-mvp/**'
      - 'profile/**'
      - 'docs/agent-runtime/product-supervisor-directive.yaml'
      - 'docs/agent-directives/**'
  pull_request:
    paths:
      - '.github/workflows/job-hunter-live.yml'
      - 'apps/job-hunter-mvp/**'
      - 'profile/**'

permissions:
  contents: write

jobs:
  live-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run deterministic regression suite
        run: node --test apps/job-hunter-mvp/lib/*.test.mjs

      - name: Materialize runtime-only acquisition credential
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          sudo install -d -m 700 -o "$(id -un)" -g "$(id -gn)" /home/dockeruser/.job-hunter-secrets
          umask 077
          if [ -n "$SERPAPI_API_KEY" ]; then
            printf 'SERPAPI_API_KEY=%s\n' "$SERPAPI_API_KEY" > /home/dockeruser/.job-hunter-secrets/serpapi.env
            echo 'SerpApi credential available; running full multi-source acquisition.'
          else
            printf 'SERPAPI_API_KEY=GITHUB_DIRECT_PROFESSION_FALLBACK\n' > /home/dockeruser/.job-hunter-secrets/serpapi.env
            echo 'SERPAPI_API_KEY absent; exercising direct Profession.hu fallback.'
          fi

      - name: Execute live Job Hunter pipeline
        run: node apps/job-hunter-mvp/run.mjs

      - name: Enforce live product acceptance
        id: acceptance
        continue-on-error: true
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'docs/evidence/real-job-hunter-current-run.json';
          if (!fs.existsSync(path)) {
            console.error(`ACCEPTANCE FAIL: missing ${path}`);
            process.exit(1);
          }
          const run = JSON.parse(fs.readFileSync(path, 'utf8'));
          const visibleFromFunnel = run?.funnelSummary?.byOutcome?.visible;
          const visibleFromResults = Array.isArray(run.results)
            ? run.results.filter(result => result?.visible === true).length
            : 0;
          const visible = Number.isFinite(visibleFromFunnel) ? visibleFromFunnel : visibleFromResults;
          const canaries = Array.isArray(run.canaries) ? run.canaries : [];
          const resolvedCanaryStatuses = new Set([
            'ACQUIRED_VISIBLE',
            'ACQUIRED_EXCLUDED',
            'ACQUIRED_SCORED_BELOW_THRESHOLD',
          ]);
          const unresolvedCanaries = canaries.filter(c => !resolvedCanaryStatuses.has(c.status));
          const summary = {
            generatedAt: run.generatedAt,
            visible,
            canariesReachedScoring: run.canariesReachedScoring,
            canaries: canaries.map(c => ({ id: c.id, status: c.status, score: c.score ?? null })),
            funnelSummary: run.funnelSummary ?? null,
          };
          console.log(JSON.stringify(summary, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Job Hunter live acceptance\n\n\`\`\`json\n${JSON.stringify(summary, null, 2)}\n\`\`\`\n`);

          const failures = [];
          if (visible < 7) failures.push(`only ${visible} visible results; active product requirement asks for 7-15 when current inventory supports it`);
          if (run.canariesReachedScoring !== true) failures.push('known-positive canaries did not all reach scoring');
          if (unresolvedCanaries.length) failures.push(`unresolved canaries: ${unresolvedCanaries.map(c => `${c.id}=${c.status}`).join(', ')}`);
          if (failures.length) {
            console.error(`ACCEPTANCE FAIL:\n- ${failures.join('\n- ')}`);
            process.exit(1);
          }
          console.log('ACCEPTANCE PASS');
          NODE

      - name: Publish human-readable current results
        if: always()
        env:
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'docs/evidence/real-job-hunter-current-run.json';
          if (!fs.existsSync(path)) process.exit(0);
          const run = JSON.parse(fs.readFileSync(path, 'utf8'));
          const results = Array.isArray(run.results) ? run.results : [];
          const visible = results.filter(r => r?.visible === true);
          const below = results.filter(r => r?.visible !== true);
          const lines = [];
          lines.push('# CURRENT JOB HUNTER RESULTS', '');
          lines.push(`**Source run:** GitHub Actions run ${process.env.GITHUB_RUN_ID}`);
          lines.push(`**Generated:** ${run.generatedAt ?? 'unknown'}`);
          lines.push(`**Visible >=60%:** ${visible.length}`);
          lines.push(`**Acceptance:** ${process.env.ACCEPTANCE_OUTCOME === 'success' ? 'PASS' : 'FAIL'}`, '');
          lines.push('## Current visible results', '');
          visible.forEach((r, i) => {
            lines.push(`${i + 1}. **${r.company ?? 'Unknown company'} — ${r.title ?? 'Unknown title'} — ${r.relevancePercent ?? '?'}%**  `);
            lines.push(`   ${r.url ?? ''}`);
            if (r.englishRequirement) lines.push(`   - English: ${r.englishRequirement}`);
            if (r.locationText) lines.push(`   - Location: ${r.locationText}`);
            lines.push('');
          });
          if (below.length) {
            lines.push('## Below-threshold candidates under review', '');
            below.forEach(r => lines.push(`- ${r.company ?? 'Unknown company'} — ${r.title ?? 'Unknown title'} — ${r.relevancePercent ?? '?'}%`));
            lines.push('');
          }
          lines.push('## Known-positive canaries', '');
          (run.canaries ?? []).forEach(c => lines.push(`- ${c.label ?? c.id}: ${c.status}${c.score != null ? `, ${c.score}%` : ''}`));
          lines.push('');
          lines.push('This file is automatically regenerated after every live Job Hunter workflow run.');
          fs.writeFileSync('CURRENT_RESULTS.md', lines.join('\n') + '\n');
          NODE
          git config user.name 'job-hunter-bot'
          git config user.email 'job-hunter-bot@users.noreply.github.com'
          git add CURRENT_RESULTS.md
          if git diff --cached --quiet; then
            echo 'CURRENT_RESULTS.md unchanged.'
          else
            git commit -m 'results: refresh current Job Hunter vacancies'
            git push
          fi

      - name: Publish run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-hunter-live-evidence
          path: |
            docs/evidence/real-job-hunter-current-run.json
            docs/evidence/job-hunter-runs/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow when product acceptance failed
        if: always() && steps.acceptance.outcome == 'failure'
        run: exit 1
